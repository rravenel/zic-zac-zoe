<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Zic-Zac-Zoe: Claim Variant. A strategic twist on tic-tac-toe where you manage resources by claiming scored cells!" />
    <title>ZIC-ZAC-ZOE</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Header -->
      <header class="header">
        <h1 class="title">ZIC-ZAC-ZOE</h1>
        <div id="mode-display" class="mode-display"></div>
      </header>

      <!-- Game Area -->
      <div id="game-area" class="game-area">
        <!-- Game Status -->
        <div id="status" class="status"></div>

        <div id="scoreboard">
          <div class="score-container x">
            <div class="score-main">
              <span class="piece x">X:</span><span id="score-x" class="score-value">    0</span>
            </div>
            <div class="turn-stats">
              <span id="moves-x" class="moves-remaining">M: 00</span>
              <span id="last-points-x" class="last-points">+0</span>
            </div>
          </div>
          
          <span class="score-separator">-</span>
          
          <div class="score-container o">
            <div class="score-main">
              <span class="piece o">O:</span><span id="score-o" class="score-value">    0</span>
            </div>
            <div class="turn-stats">
              <span id="moves-o" class="moves-remaining">M: 00</span>
              <span id="last-points-o" class="last-points">+0</span>
            </div>
          </div>
        </div>

        <!-- Game Status -->
        <div id="status" class="status"></div>

        <!-- Game Board Container -->
        <div class="board-container">
          <div id="board" class="board">
            <!-- 36 cells will be generated by JS -->
          </div>
          <div id="config-error" class="config-error-overlay hidden">
            <div class="error-message">CONFIGURATION ERROR</div>
          </div>
        </div>
      </div>

      <!-- Stats (below board) -->
      <div class="stats-row">
        <div id="stats-won" class="stats-box">WON: 000</div>
        <div id="stats-lost" class="stats-box">LOST: 000</div>
      </div>

      <!-- Controls -->
      <div id="controls" class="controls">
        <div class="controls-left">
          <button id="btn-claim" class="btn btn-action">CLAIM</button>
          <button id="btn-pass" class="btn btn-action">PASS</button>
        </div>
        <button id="btn-new-game" class="btn btn-new-game">NEW GAME</button>
      </div>

      <!-- Loading overlay -->
      <div id="loading" class="loading">
        <div class="loading-text">LOADING AI...</div>
      </div>

    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
